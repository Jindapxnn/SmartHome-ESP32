<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AWS IoT LED Control</title>
    <!-- ใช้ Tailwind CSS (CDN) แทน Bootstrap เพื่อความรวดเร็ว -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background-color: #f8f9fa;
        font-family: "Inter", sans-serif;
      }
      .card-control {
        max-width: 400px;
        margin: 50px auto;
        box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <!-- แก้ไข onload ให้เรียกฟังก์ชัน initApp() -->
  <body onload="initApp()">
    <div class="container mx-auto p-4">
      <div class="card-control bg-white p-6 rounded-xl text-center">
        <div class="bg-indigo-600 text-white p-4 rounded-t-xl">
          <h4 class="text-xl font-bold">IoT Smart Home Controller (REST)</h4>
        </div>
        <div class="p-6">
          <p class="text-lg mb-4">
            สถานะปัจจุบัน:
            <!-- ID: status-display ถูกใช้ใน app.js -->
            <span
              id="status-display"
              class="bg-gray-400 text-white px-3 py-1 rounded-full text-lg font-semibold"
              >Connecting...</span
            >
          </p>

          <div class="grid grid-cols-1 gap-4">
            <button
              id="onButton"
              class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition duration-150 ease-in-out disabled:opacity-50 text-xl"
              onclick="sendCommand('on')"
              disabled
            >
              เปิดไฟ (ON)
            </button>
            <button
              id="offButton"
              class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition duration-150 ease-in-out disabled:opacity-50 text-xl"
              onclick="sendCommand('off')"
              disabled
            >
              ปิดไฟ (OFF)
            </button>
          </div>
        </div>
        <div class="text-gray-500 text-xs border-t pt-2 mt-4">
          API Status: <span id="api-status">Initializing...</span>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
